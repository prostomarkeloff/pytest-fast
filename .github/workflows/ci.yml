name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint runs once (single OS / single Python) — code style is platform-agnostic.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync dev deps
        run: uv sync --frozen --group dev
      - name: Run lint-heavy (check-only)
        run: make lint-heavy LINT_HEAVY_CI=1

  # Tests run on the full matrix: Linux + macOS (must pass), Windows (future work —
  # forkserver/AF_UNIX/fcntl bits don't work on Windows, so we allow failures there
  # until someone ports them. The job still runs to surface what specifically breaks).
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Sync deps (pinned Python)
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Run test-full (dogfood)
        # On Windows pytest-fast can't run yet (forkserver/AF_UNIX), but we surface
        # the failure mode rather than silently skipping. `continue-on-error` above
        # marks the job as warning, not failure, on Windows.
        run: make test-full
        shell: bash
